name: Release

on:
  push:
    branches: [main]
  # Manual re-run of the MCP Registry publish alone, for when npm
  # succeeded but the registry step failed (e.g. npm propagation race).
  # The `release` job is skipped; only `publish-registry` runs, using
  # the version already committed in `server.json` on the default branch.
  workflow_dispatch:

permissions:
  contents: write       # tags + GitHub Releases
  pull-requests: write  # Version Packages PR
  id-token: write       # OIDC for npm + mcp-publisher

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Persist the PAT (instead of the default GITHUB_TOKEN) in
          # `.git/config`. Since changesets/action@v2 the release
          # commit and tags are pushed through the GitHub API with the
          # `github-token` input rather than the Git CLI, so this is a
          # fallback for any remaining Git CLI operation in the job —
          # it keeps them authenticated as the PAT owner, whose pushes
          # do trigger downstream `pull_request` workflows (GitHub
          # suppresses those for GITHUB_TOKEN to prevent recursion).
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - id: changesets
        uses: changesets/action@v2
        with:
          # Fine-grained PAT (Contents + Pull requests RW) so pushes to
          # `changeset-release/main` trigger downstream `pull_request`
          # workflows. The default GITHUB_TOKEN is suppressed by GitHub
          # to prevent recursion, which leaves required status checks
          # stuck "Expected — Waiting for status to be reported" on the
          # Version Packages PR. Since v2 the token must be passed
          # through this input — the GITHUB_TOKEN env var is ignored.
          github-token: ${{ secrets.RELEASE_PAT }}
          version-script: npm run version-packages
          publish-script: npm run release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # Registering with the MCP Registry is a separate job so a failure here
  # never masks a successful npm publish, and so it can be retried on its
  # own via `workflow_dispatch` without re-running the release.
  publish-registry:
    needs: release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release.outputs.published == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On `push`, the release job has just committed the version bump
          # through the GitHub API, so the checked-out ref is one commit
          # behind — take the branch tip to get the bumped `server.json`.
          ref: ${{ github.ref_name }}

      - name: Wait for the npm version to be resolvable
        shell: bash
        run: |
          set -euo pipefail
          # The MCP Registry validates that the npm package version exists
          # before accepting the server entry. npm's registry needs a moment
          # to serve a freshly published version, so poll before publishing.
          PKG="$(jq -r '.packages[0].identifier' server.json)"
          VERSION="$(jq -r '.packages[0].version' server.json)"
          for attempt in $(seq 1 20); do
            if npm view "${PKG}@${VERSION}" version > /dev/null 2>&1; then
              echo "${PKG}@${VERSION} is live on npm (attempt ${attempt})"
              exit 0
            fi
            echo "${PKG}@${VERSION} not on npm yet (attempt ${attempt}/20); retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} never appeared on npm after 5 minutes"
          exit 1

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          # Pinned in a shell variable, not an action ref, so Dependabot cannot
          # track it — bump manually. Releases: modelcontextprotocol/registry.
          MCP_PUBLISHER_VERSION="1.8.1"
          ASSET="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl -fSL -o "$ASSET" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${ASSET}"
          curl -fSL -o checksums.txt "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          if ! grep -q "  ${ASSET}$" checksums.txt; then
            echo "::error::Checksum entry for ${ASSET} not found in checksums.txt"
            exit 1
          fi
          grep "  ${ASSET}$" checksums.txt | sha256sum -c -
          tar xzf "$ASSET" mcp-publisher
          rm "$ASSET" checksums.txt

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          # Retry anyway: the registry re-validates against npm on its own
          # side and can still see a stale 404 right after publication.
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "publish failed (attempt ${attempt}/3); retrying in 30s"
            sleep 30
          done
          echo "::error::mcp-publisher publish failed after 3 attempts"
          exit 1
