name: Release

on:
  push:
    branches: [main]
  # Manual re-run of the MCP Registry publish alone, for when npm
  # succeeded but the registry step failed (e.g. npm propagation race).
  # The `release` job is skipped; only `publish-registry` runs, using
  # the version already committed in `server.json` on the default branch.
  workflow_dispatch:

# No default permissions: each job declares the ones it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + GitHub Releases
      pull-requests: write # Version Packages PR
      id-token: write # OIDC for npm
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # No `github-token`: the action defaults to this job's
          # GITHUB_TOKEN, so the Version Packages PR, its commit, the tags
          # and the GitHub Release are authored by github-actions[bot] and
          # no personal token is stored in the repository.
          #
          # GitHub does not start workflows for a push made with
          # GITHUB_TOKEN: on the Version Packages PR the CI runs wait for
          # a maintainer to click "Approve workflows to run". The required
          # checks report once that is done. Every update of the PR needs
          # the click again.
          version-script: npm run version-packages
          publish-script: npm run release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # Registering with the MCP Registry is a separate job so a failure here
  # never masks a successful npm publish, and so it can be retried on its
  # own via `workflow_dispatch` without re-running the release.
  publish-registry:
    needs: release
    # Only ever from `main`: a manual run started on another branch would
    # otherwise publish that branch's `server.json`.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # OIDC for mcp-publisher
    steps:
      # The `if:` above compares without regard to case, so a branch named
      # `Main` would pass it. The shell comparison is exact.
      - name: Refuse any ref but main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On `push`, the release job has just committed the version bump
          # through the GitHub API, so the checked-out ref is one commit
          # behind — take the branch tip to get the bumped `server.json`.
          ref: ${{ github.ref_name }}

      - name: Wait for the npm version to be resolvable
        shell: bash
        run: |
          set -euo pipefail
          # The MCP Registry validates that the npm package version exists
          # before accepting the server entry. npm's registry needs a moment
          # to serve a freshly published version, so poll before publishing.
          PKG="$(jq -r '.packages[0].identifier' server.json)"
          VERSION="$(jq -r '.packages[0].version' server.json)"
          for attempt in $(seq 1 20); do
            if npm view "${PKG}@${VERSION}" version > /dev/null 2>&1; then
              echo "${PKG}@${VERSION} is live on npm (attempt ${attempt})"
              exit 0
            fi
            echo "${PKG}@${VERSION} not on npm yet (attempt ${attempt}/20); retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} never appeared on npm after 5 minutes"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # The action defaults to cosign v3.0.6, which is affected by
          # GHSA-fx35-mq7g-6g98 (identity checks bypassed via a legacy bundle).
          # Fixed in v3.1.3 — bump manually, Dependabot does not track it.
          cosign-release: "v3.1.4"

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          # Pinned in a shell variable, not an action ref, so Dependabot cannot
          # track it — bump manually. Releases: modelcontextprotocol/registry.
          MCP_PUBLISHER_VERSION="1.8.6"
          ASSET="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          BASE_URL="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fSL -o "$ASSET" "${BASE_URL}/${ASSET}"
          curl -fSL -o "${ASSET}.sigstore.json" "${BASE_URL}/${ASSET}.sigstore.json"
          # Verify the Sigstore bundle against the registry's release workflow
          # identity, so a tampered release asset cannot pass (a checksum file
          # from the same release could be swapped alongside it).
          cosign verify-blob \
            --bundle "${ASSET}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/v${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$ASSET"
          tar xzf "$ASSET" mcp-publisher
          rm "$ASSET" "${ASSET}.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          # Retry anyway: the registry re-validates against npm on its own
          # side and can still see a stale 404 right after publication.
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "publish failed (attempt ${attempt}/3); retrying in 30s"
            sleep 30
          done
          echo "::error::mcp-publisher publish failed after 3 attempts"
          exit 1
