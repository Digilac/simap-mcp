name: CI

# On every pull request, whatever its base, so stacked PRs are checked too.
# Not on push: nothing is pushed directly to `main` except merges, and
# `release.yml` already re-runs the full lint/typecheck/format/build/test
# suite on every push to `main`. Running CI on push as well would duplicate
# that for no added signal.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test (with coverage thresholds)
        run: npm run test:coverage
