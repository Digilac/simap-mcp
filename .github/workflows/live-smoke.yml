name: Live smoke

# Calls every tool against the real simap API. simap changes its
# responses without notice, and the unit tests run on captured payloads, so
# this is the only check that fails when a tool can no longer read simap.
# GitHub notifies one person of a failed scheduled run: whoever last edited
# the `cron` line below or last re-enabled this workflow, if their account has
# Actions notifications on. It
# also disables scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Call every tool against simap
        run: npm run test:live
